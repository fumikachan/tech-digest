# アプリ + PostgreSQL をまとめて動かす。
#   docker compose run --rm app      # 取得してダイジェストを出力（db は自動で起動する）
#   docker compose down              # 止める（DB のデータはボリュームに残る）
# パスワードなどは .env に書く（.env.example を参照）。compose は .env を自動で読む。

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: tech_digest
      POSTGRES_DB: tech_digest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
    volumes:
      # PostgreSQL 18 からはデータの親ディレクトリ /var/lib/postgresql にマウントする
      - db-data:/var/lib/postgresql
    healthcheck:
      # 「コンテナが起動した」ではなく「接続を受け付けられる」になってから app を起動するため
      test: ["CMD-SHELL", "pg_isready -U tech_digest -d tech_digest"]
      interval: 2s
      timeout: 5s
      retries: 15
    # ports は公開しない。app からは compose のネットワーク内で「db」というホスト名で届く。
    # 手元から中を見るときは: docker compose exec db psql -U tech_digest

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://tech_digest:${POSTGRES_PASSWORD}@db:5432/tech_digest
      QIITA_TOKEN: ${QIITA_TOKEN:-}
    volumes:
      - ./digests:/output
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
