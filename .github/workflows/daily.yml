# 毎朝 7:00（JST）に記事を集め、その日の記録を data ブランチに保存して、サイトを更新する。
# 本格的な定期実行は Phase 3（AWS）で行う。これは無料でできる最初の定期実行。
#
# ジョブを分けている理由:
#   collect（記事を集める）は外部サイトのデータと外部ライブラリを扱うので、読み取り権限だけで動かす。
#   record（data ブランチに push）は git しか動かさないジョブにして、そこだけに書き込み権限を付ける。
#   ライブラリが乗っ取られても、書き込みできるトークンに手が届かないようにするため。
#
# - DB は SQLite。actions/cache で次の実行に引き継ぎ、「初めて載った日」の記録を保つ
#   （キャッシュは 7 日使われないと消える。消えても過去の記録は data ブランチの JSON に残る）
# - QIITA_TOKEN は Settings → Secrets and variables → Actions に置く（任意）。
#   GitHub のランナーは IP を共有しているので、トークンなしだと Qiita の制限（60 回/時）に当たりやすい
# - 公開リポジトリで 60 日間コミットがないと、GitHub がスケジュール実行を自動で止める
name: Daily digest

on:
  schedule:
    - cron: "0 22 * * *" # UTC 22:00 = JST 7:00（cron は UTC で書く）
  workflow_dispatch: # Actions の画面から手動でも実行できる

permissions:
  contents: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  collect:
    name: 記事を集める
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TECH_DIGEST_DB_PATH: data/tech-digest.db
      TECH_DIGEST_OUTPUT_DIR: digests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: 依存のインストール
        run: uv sync --locked --no-dev

      # 前回の DB を取り出す。キーは実行ごとに変わるので、restore-keys で一番新しいものを使う
      - name: DB を復元
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: digest-db-${{ github.run_id }}
          restore-keys: digest-db-

      # QIITA_TOKEN はこのステップにだけ渡す
      - name: 記事を集める
        env:
          QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
        run: uv run tech-digest run

      # 取得元の一部が失敗しても（終了コード 1）、取れた分は記録して公開する
      - name: DB を保存
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: digest-db-${{ github.run_id }}

      - name: その日の記録を JSON に書き出す
        if: ${{ !cancelled() }}
        run: uv run tech-digest export --out export

      # 次のジョブ（record）に JSON を渡す
      - name: JSON を受け渡す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-json
          path: export/*.json
          retention-days: 7
          if-no-files-found: error

  record:
    name: data ブランチに記録する
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # data ブランチに push するので、このジョブだけ書き込み権限を付ける（main はルールセットで保護済み）。
    # このジョブでは git 以外のプログラムを動かさない
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: daily-json
          path: daily

      - name: コミットして push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "Add digest $(TZ=Asia/Tokyo date +%F)"
            git push
          fi

  pages:
    name: サイトを更新
    needs: record
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/pages.yml
    # 呼び出し先（pages.yml）が使う権限を渡す
    permissions:
      contents: read
      pages: write
      id-token: write
