# PR と main への push で、lint・型チェック・テスト・Docker のビルドを確認する。
# アクションは SHA で固定している（タグの付け替えによる乗っ取りを防ぐため）。更新は Dependabot が行う。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# GITHUB_TOKEN の権限は読み取りだけにする（必要なジョブだけで広げる）
permissions:
  contents: read

# 同じ PR に続けて push したら、古い実行は止める（無駄な実行を減らす）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint・型チェック・テスト
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # テスト用の PostgreSQL。ジョブの間だけ動くコンテナ（サービスコンテナ）
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: 依存のインストール
        run: uv sync --locked

      - name: lint（ruff check）
        run: uv run ruff check .

      - name: 整形の確認（ruff format）
        run: uv run ruff format --check .

      - name: 型チェック（pyright）
        run: uv run pyright

      - name: テスト（pytest）
        run: uv run pytest -rs

  web:
    name: web（型チェック・テスト・ビルド）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node のバージョンは web/.nvmrc（手元の nvm と同じ）に合わせる
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # package-lock.json のとおりに入れる（ずれていたら失敗する。uv sync --locked と同じ）
      - name: 依存のインストール
        run: npm ci

      - name: 型チェック（tsc）
        run: npm run typecheck

      - name: テスト（vitest）
        run: npm test

      - name: ビルド（vite）
        run: npm run build

  docker:
    name: Docker イメージのビルド
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # push はしない。Dockerfile が壊れていないかだけ確認する（GitHub のキャッシュでビルドを速くする）
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
